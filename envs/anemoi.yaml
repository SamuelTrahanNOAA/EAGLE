# yamllint disable rule:anchors rule:line-length

channels:
  - nodefaults
  - conda-forge
  - ufs-community
dependencies:
  - flash-attn 2.8.*
  - matplotlib >=3.7.1,<3.9 # low bound per anemoi-training; high bound per matplotlib Issue 28317
  - mpi4py 4.1.*
  - numpy 2.2.6.*
  - pip
  - python 3.12
  - pytorch 2.10.*
  - setuptools 81.0.*
  - triton 3.6.*
  - uwtools 2.16.*
  - pydantic<2.0
  - pip:
      - anemoi-inference==0.11.1
      - anemoi-models==0.16.0
      - anemoi-training==0.14.0
      - anemoi-transform==0.4.2
      - eagle-tools==0.8.1
      - anemoi-training[plotting]
